name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk WaterCheck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WaterCheck
          path: WaterCheck.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${VERSION_CODE}" WaterCheck.apk --title "WaterCheck 1.0.${VERSION_CODE}" --notes "Automatický build z ${GITHUB_SHA::7}"
